name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: current
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Lint
        run: npm run lint

  test:
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: current
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build native addon
        run: npm run rebuild
      - name: Test
        run: npm test
        env:
          CI: true
